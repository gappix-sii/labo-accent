<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#150d3d">
<meta name="description" content="Entraînement à la prononciation anglaise, analyse son par son, 100 % dans le navigateur.">
<title>Labo d'accent</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="hud">
  <div class="hud-in">
    <span class="brand">Labo <b>d'accent</b></span>
    <span class="stat flame off" id="hStreak" title="Jours de suite"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff9f43" d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3-1-3 0-6 1-9.5z"/><path fill="#ffd23f" d="M12 12c.6 1.6 2 2.4 2 4a2 2 0 0 1-4 0c0-1 .5-1.6 1-2 0 .7.4 1 .8 1-.3-1 0-2 .2-3z"/></svg><span>0</span></span>
    <span class="stat" id="hXp" title="XP"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffd23f" d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21.1l1.4-7L2 9.3l7-.8z"/></svg><span>0</span></span>
    <span class="stat timer" id="hTimer" hidden title="Temps restant"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4cc9f0" d="M9 1h6v2H9zm3 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9zm1 9.4V7h-2v7.4l4.3 2.5 1-1.7z"/></svg><span>0:00</span></span>
    <button class="iconbtn" id="hVoice" aria-pressed="true" title="Voix de Pouf"></button>
    <span class="engine-dot" id="engine" data-state="off" title="Moteur d'analyse : non préparé"></span>
  </div>
</header>

<main id="view" tabindex="-1">
  <noscript><p class="card">Cette appli a besoin de JavaScript.</p></noscript>
  <p class="card muted">Chargement…</p>
</main>

<nav class="bottom" aria-label="Sections">
  <button data-go="path" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 3 7v2h18V7zM5 11v7h3v-7zm5.5 0v7h3v-7zM16 11v7h3v-7zM3 20v2h18v-2z"/></svg><span class="lg">Parcours</span><span class="sh">Parcours</span></button>
  <button data-go="session"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 1h6v2H9zm3 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9zm1 9.4V7h-2v7.4l4.3 2.5 1-1.7z"/></svg><span class="lg">Séance</span><span class="sh">Séance</span></button>
  <button data-go="vocab"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 3h7a3 3 0 0 1 3 3v15a2 2 0 0 0-2-2H4zm16 0h-4a3 3 0 0 0-1 .2V21a2 2 0 0 1 1-.5h4z"/></svg><span class="lg">Vocabulaire</span><span class="sh">Mots</span></button>
  <button data-go="train"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12z"/></svg><span class="lg">Entraînement</span><span class="sh">Libre</span></button>
  <button data-go="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-9 2.2-9 5v3h18v-3c0-2.8-4.6-5-9-5z"/></svg><span class="lg">Profil</span><span class="sh">Profil</span></button>
</nav>

<dialog id="dlg">
  <div class="dlg">
    <h2 id="dlgTitle">Confirmer</h2>
    <p id="dlgText"></p>
    <div class="row between">
      <button type="button" class="btn ghost sm" id="dlgCancel">Annuler</button>
      <button type="button" class="btn red sm" id="dlgOk">Confirmer</button>
    </div>
  </div>
</dialog>
<dialog id="cel">
  <div class="dlg center" id="celBody"></div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
</body>
</html>
