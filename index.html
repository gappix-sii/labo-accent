<!DOCTYPE html>
<html lang="fr" data-theme="nuit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self' https://generativelanguage.googleapis.com; img-src 'self'; media-src 'self' blob:; style-src 'self'; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types labo">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#150d3d">
<meta name="description" content="Entraînement à la prononciation anglaise façon jeu vidéo : analyse son par son, 100 % dans le navigateur.">
<title>Labo d'accent</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="bgfx" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="hud">
  <div class="hud-in">
    <button class="me" id="hMe" aria-label="Mon profil"><span class="me-av" id="hAv"></span><span class="me-lv" id="hLv">1</span></button>
    <button class="brand" id="brand" type="button">Labo <b>d'accent</b></button>
    <span class="hud-stats">
      <span class="stat flame off" id="hStreak" title="Jours de suite"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff9f43" d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3-1-3 0-6 1-9.5z"/><path fill="#ffd23f" d="M12 12c.6 1.6 2 2.4 2 4a2 2 0 0 1-4 0c0-1 .5-1.6 1-2 0 .7.4 1 .8 1-.3-1 0-2 .2-3z"/></svg><span>0</span></span>
      <button class="stat coins" id="hCoins" title="Pièces : boutique et boîtes à butin" aria-label="Pièces : ouvrir la boutique et les boîtes à butin"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffd23f" stroke="#c99a00" stroke-width="2"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#c99a00" stroke-width="1.5"/><path d="M12 8.2l1.2 2.5 2.7.3-2 1.8.6 2.7-2.5-1.4-2.5 1.4.6-2.7-2-1.8 2.7-.3z" fill="#fff3b0"/></svg><span>0</span><b class="plus" aria-hidden="true">+</b></button>
      <button class="stat chest" id="hChest" hidden title="Coffres à ouvrir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a5 5 0 0 1 5-5h8a5 5 0 0 1 5 5z" fill="#c98b5a" stroke="#6b4129" stroke-width="1.5"/><rect x="3" y="10" width="18" height="10" rx="2" fill="#a86a3d" stroke="#6b4129" stroke-width="1.5"/><rect x="10" y="9" width="4" height="5" rx="1" fill="#ffd23f" stroke="#c99a00"/></svg><span>0</span></button>
      <span class="stat boost" id="hBoost" hidden title="Potion d'XP active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="#ffd23f" stroke="#c99a00" stroke-width="1.2" stroke-linejoin="round"/></svg><span>×2</span></span>
      <span class="stat timer" id="hTimer" hidden title="Temps restant"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4cc9f0" d="M9 1h6v2H9zm3 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9zm1 9.4V7h-2v7.4l4.3 2.5 1-1.7z"/></svg><span>0:00</span></span>
    </span>
    <button class="iconbtn" id="hVoice" aria-pressed="true" title="Voix du compagnon"></button>
    <span class="engine-dot" id="engine" data-state="off" title="Moteur d'analyse : non préparé"></span>
  </div>
</header>

<main id="view" tabindex="-1">
  <noscript><p class="card">Cette appli a besoin de JavaScript.</p></noscript>
  <p class="card muted">Chargement…</p>
</main>

<nav class="bottom" aria-label="Sections">
  <button data-go="path" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 3 7v2h18V7zM5 11v7h3v-7zm5.5 0v7h3v-7zM16 11v7h3v-7zM3 20v2h18v-2z"/></svg><span class="lg">Parcours</span><span class="sh">Parcours</span></button>
  <button data-go="session"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 1h6v2H9zm3 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9zm1 9.4V7h-2v7.4l4.3 2.5 1-1.7z"/></svg><span class="lg">Séance</span><span class="sh">Séance</span></button>
  <button data-go="vocab"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 3h7a3 3 0 0 1 3 3v15a2 2 0 0 0-2-2H4zm16 0h-4a3 3 0 0 0-1 .2V21a2 2 0 0 1 1-.5h4z"/></svg><span class="lg">Apprendre</span><span class="sh">Cours</span></button>
  <button data-go="train"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12z"/></svg><span class="lg">Pratique</span><span class="sh">Parler</span></button>
  <button data-go="arena"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 3h10v4a5 5 0 0 1-10 0zM4 4h2v3a3 3 0 0 1-2-3zm14 0h2a3 3 0 0 1-2 3zm-7.5 9h3v3h-3zM7 17h10v4H7z"/></svg><span class="lg">Arène</span><span class="sh">Arène</span></button>
  <button data-go="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-9 2.2-9 5v3h18v-3c0-2.8-4.6-5-9-5z"/></svg><span class="lg">Profil</span><span class="sh">Profil</span></button>
</nav>

<dialog id="dlg">
  <div class="dlg">
    <h2 id="dlgTitle">Confirmer</h2>
    <p id="dlgText"></p>
    <div class="row between">
      <button type="button" class="btn ghost sm" id="dlgCancel">Annuler</button>
      <button type="button" class="btn red sm" id="dlgOk">Confirmer</button>
    </div>
  </div>
</dialog>
<dialog id="cel"><div class="dlg center" id="celBody"></div><canvas class="dfx" aria-hidden="true"></canvas></dialog>
<dialog id="chestDlg"><div class="dlg center" id="chestBody"></div><canvas class="dfx" aria-hidden="true"></canvas></dialog>
<dialog id="boxDlg"><div class="dlg center box-dlg" id="boxBody"></div><canvas class="dfx" aria-hidden="true"></canvas></dialog>
<div id="notif" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="fxl" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
</body>
</html>
